name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Device to build
        required: true
        default: x1q
        type: choice
        options:
          - x1q
          - y2q
          - z3q
  pull_request:
  push:
    branches:
      - 'seventeen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'x1q' }}
        run: |
          matrix="$(jq -cn --arg target "$SELECTED_TARGET" '[$target]')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    if: github.event_name == 'workflow_dispatch'
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Use Ubuntu archive mirror
        run: |
          sudo sed -i -E \
            -e 's|mirror\+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources

      - name: Free disk space (1/2)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/2)
        # This action deletes dangling symlinks throughout /home/runner.
        # Run it before checkout so Android /apex links survive in prebuilts.
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_all'

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Set up build environment
        run: |
          sudo apt update
          sudo env DEBIAN_FRONTEND=noninteractive apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          sudo apt install -yq linux-modules-extra-$(uname -r) || echo "Runner kernel modules are already supplied or unavailable"
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          grep -wE "erofs|f2fs" /proc/filesystems || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        env:
          FUS_IMEI: ${{ secrets.S928N_FUS_IMEI }}
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_on: error
          command: SOURCE_FIRMWARE="${SOURCE_FIRMWARE%/*}/${FUS_IMEI:-${SOURCE_FIRMWARE##*/}}" ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: ./scripts/make_rom.sh -z

      - name: Upload ROM
        uses: actions/upload-artifact@v7
        with:
          name: UN1CA-${{ matrix.target }}-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/UN1CA_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ env.OUT_DIR }}/config.sh
            ${{ env.APKTOOL_DIR }}/system/framework
          if-no-files-found: ignore
          retention-days: 3
