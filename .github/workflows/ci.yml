name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: Device to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x1q
          - y2q
          - z3q
  pull_request:
  push:
    branches:
      - 'seventeen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /platform/**/*.sh
            /scripts/**/*.sh
            /target/**/*.sh
            /unica/**/*.sh
            /external/make.sh

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

      - name: Generate CI matrix
        id: generate-matrix
        env:
          SELECTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          if [[ "$SELECTED_TARGET" == "all" ]]; then
            matrix='["x1q","y2q","z3q"]'
          else
            matrix="$(jq -cn --arg target "$SELECTED_TARGET" '[$target]')"
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    needs: shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.shellcheck.outputs.matrix) }}

    steps:
      - name: Use Ubuntu archive mirror
        run: |
          sudo sed -i -E \
            -e 's|mirror\+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources

      - name: Free up workflow space
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          sed -i 's/sudo apt purge/sudo apt-get purge/g' util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          sparse-checkout: |
            .github
            external
            scripts
            security
            ota
            unica
            platform/sm8250
            target/${{ matrix.target }}

      - name: Restore or download prebuilts
        uses: ./.github/actions/prebuilts

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Restore OTA signing key
        if: env.ROM_OTA_ENABLED == 'true'
        env:
          OTA_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          test -n "$OTA_PK8" && test -n "$OTA_PEM" || { echo "OTA_KEY_PK8 and OTA_KEY_PEM secrets are required (scripts/generate_ota_key.sh --help)" >&2; exit 1; }
          umask 077
          printf '%s' "$OTA_PK8" | base64 --decode > security/unica_ota.pk8
          printf '%s' "$OTA_PEM" | base64 --decode > security/unica_ota.x509.pem

      - name: Set up build environment
        run: |
          sudo apt update
          sudo env DEBIAN_FRONTEND=noninteractive apt install -yq \
            attr ccache clang ffmpeg jq libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp
          sudo apt install -yq linux-modules-extra-$(uname -r) || echo "Runner kernel modules are already supplied or unavailable"
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          grep -wE "erofs|f2fs" /proc/filesystems || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        uses: ./.github/actions/build-dependencies

      - name: Restore or download base firmware
        uses: ./.github/actions/firmware
        with:
          firmware: ${{ env.SOURCE_FIRMWARE }}


      - name: Restore or download x1q target firmware
        if: matrix.target == 'x1q'
        uses: ./.github/actions/firmware
        with:
          firmware: ${{ env.TARGET_FIRMWARE }}

      - name: Download remaining stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract remaining stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Calculate wallpaper cache key
        id: wallpaper-key
        run: bash "$SRC_DIR/scripts/internal/ci_cache.sh" wallpaper

      - name: Restore converted wallpapers
        id: wallpapers
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.WALLPAPER_CACHE_DIR }}
          key: ${{ steps.wallpaper-key.outputs.wallpaper_key }}

      - name: Build ROM
        run: ./scripts/make_rom.sh --flashable-only

      - name: Save converted wallpapers
        if: steps.wallpapers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.WALLPAPER_CACHE_DIR }}
          key: ${{ steps.wallpaper-key.outputs.wallpaper_key }}

      - name: Upload ROM
        uses: actions/upload-artifact@v7
        with:
          name: UN1CA-${{ matrix.target }}-${{ github.sha }}
          path: ${{ env.OUT_DIR }}/UN1CA_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)

          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")

          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo "SHA256:"
          sha256sum "$ZIP_FILE"

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ env.OUT_DIR }}/config.sh
            ${{ env.APKTOOL_DIR }}/system/framework
          if-no-files-found: ignore
          retention-days: 3
