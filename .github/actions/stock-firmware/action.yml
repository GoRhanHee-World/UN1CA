name: Cached stock firmware
description: Cache original Odin packages using the resolved Samsung firmware versions.
runs:
  using: composite
  steps:
    - name: Resolve current firmware versions
      id: versions
      shell: bash
      run: bash "$SRC_DIR/scripts/internal/ci_cache.sh" firmware

    - name: Restore source firmware
      id: source
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.versions.outputs.source_paths }}
        key: ${{ steps.versions.outputs.source_key }}

    - name: Restore target firmware
      if: steps.versions.outputs.target_key != ''
      id: target
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.versions.outputs.target_paths }}
        key: ${{ steps.versions.outputs.target_key }}

    - name: Download missing firmware versions
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 180
        max_attempts: 3
        retry_on: error
        command: ./scripts/download_fw.sh

    - name: Verify firmware versions before caching
      shell: bash
      run: bash "$SRC_DIR/scripts/internal/ci_cache.sh" verify-firmware

    # Save before extract_fw.sh deletes Odin packages to reclaim runner space.
    - name: Save source firmware
      if: steps.source.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.versions.outputs.source_paths }}
        key: ${{ steps.versions.outputs.source_key }}

    - name: Save target firmware
      if: steps.versions.outputs.target_key != '' && steps.target.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.versions.outputs.target_paths }}
        key: ${{ steps.versions.outputs.target_key }}
